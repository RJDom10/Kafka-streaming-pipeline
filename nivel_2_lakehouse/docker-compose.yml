# ==============================================================================
# Laboratorio 2: Streaming Lakehouse (Kafka + PySpark + Apache Iceberg + MinIO + Trino)
# Arquitectura Medallion: Bronze (raw) -> Silver (cleaned) -> Gold (aggregated)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Apache Kafka en modo KRaft (sin ZooKeeper)
  #    Broker de mensajes que recibe los eventos de Wikimedia en tiempo real.
  # ----------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: lab2-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L622nShTUiBenA1g20Tsw'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xmx512m -Xms512m"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - lab2-network

  # ----------------------------------------------------------------------------
  # 2. Inicializador de Topicos (ephemeral — se apaga al terminar)
  #    Crea el topico wiki.changes con 3 particiones antes de que arranque
  #    el productor y el motor de Spark.
  # ----------------------------------------------------------------------------
  init-kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: lab2-init-kafka
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic wiki.changes --partitions 3 --replication-factor 1
      echo 'Topico wiki.changes verificado/creado exitosamente.'
      "
    networks:
      - lab2-network

  # ----------------------------------------------------------------------------
  # 3. MinIO — Object Storage S3-Compatible
  #    Almacena los archivos Parquet de las tablas Iceberg (Bronze/Silver/Gold)
  #    y los checkpoints del Structured Streaming de Spark.
  #    Consola visual: http://localhost:9001 (admin / password)
  # ----------------------------------------------------------------------------
  minio:
    image: elestio/minio:latest
    container_name: lab2-minio
    hostname: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - lab2-network

  # ----------------------------------------------------------------------------
  # 4. S3 Bucket Init (ephemeral)
  #    Crea los buckets S3 necesarios para Iceberg y los checkpoints de Spark.
  # ----------------------------------------------------------------------------
  mc-init:
    image: amazon/aws-cli:latest
    container_name: lab2-mc-init
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      until aws --endpoint-url http://minio:9000 s3 ls > /dev/null 2>&1; do
        echo 'Esperando a MinIO...';
        sleep 2;
      done;
      aws --endpoint-url http://minio:9000 s3 mb s3://warehouse || true;
      aws --endpoint-url http://minio:9000 s3 mb s3://checkpoints || true;
      echo 'Buckets warehouse y checkpoints creados exitosamente.';
      "
    networks:
      - lab2-network

  # ----------------------------------------------------------------------------
  # 5. Apache Iceberg REST Catalog
  #    Servicio de catalogo que gestiona los metadatos de las tablas Iceberg
  #    (namespaces, schemas, snapshots, particiones). Spark y Trino se conectan
  #    a este catalogo para descubrir y operar sobre las tablas.
  # ----------------------------------------------------------------------------
  iceberg-rest:
    image: tabulario/iceberg-rest:1.5.0
    container_name: lab2-iceberg-rest
    hostname: iceberg-rest
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_S3_PATH__STYLE__ACCESS: 'true'
    depends_on:
      minio:
        condition: service_healthy
      mc-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      lab2-network:
        aliases:
          - rest

  # ----------------------------------------------------------------------------
  # 6. PySpark + Apache Iceberg + Kafka Connector
  #    Motor de procesamiento distribuido. Ejecuta los scripts de las capas
  #    Bronze (streaming), Silver (batch) y Gold (batch). Incluye Jupyter
  #    Notebook para explorar datos interactivamente en http://localhost:8888
  # ----------------------------------------------------------------------------
  spark-iceberg:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: lab2-spark
    hostname: spark-iceberg
    ports:
      - "8888:8888"
      - "4040:4040"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    volumes:
      - ./spark:/home/iceberg/scripts
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      iceberg-rest:
        condition: service_started
      mc-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 2048M
    networks:
      - lab2-network

  # ----------------------------------------------------------------------------
  # 7. Trino — Motor de Consultas SQL Distribuido
  #    Permite ejecutar consultas SQL ANSI directamente sobre las tablas
  #    Iceberg almacenadas en MinIO. Acceso CLI via:
  #      docker compose exec trino trino
  # ----------------------------------------------------------------------------
  trino:
    image: trinodb/trino:450
    container_name: lab2-trino
    hostname: trino
    ports:
      - "8082:8080"
    volumes:
      - ./conf/trino/catalog:/etc/trino/catalog
    depends_on:
      iceberg-rest:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - lab2-network

  # ----------------------------------------------------------------------------
  # 8. Productor de Eventos Wikimedia (Python)
  #    Conecta al stream SSE de Wikimedia y publica eventos limpios al topico
  #    wiki.changes de Kafka. Reutiliza la logica del Nivel 1.
  # ----------------------------------------------------------------------------
  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: lab2-producer
    command: python -u producer.py
    restart: on-failure
    environment:
      KAFKA_BROKER: "kafka:29092"
      TOPIC_NAME: "wiki.changes"
    depends_on:
      kafka:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - lab2-network

volumes:
  minio_data:
    driver: local

networks:
  lab2-network:
    name: lab2-network
    driver: bridge
